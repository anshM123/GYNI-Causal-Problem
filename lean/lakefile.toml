name = "gyni_lower_bound"
defaultTargets = ["GYNIProof", "GYNIUpper"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib pinned to the exact revision used for all checks (Lean v4.33.1).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "GYNIProof"
globs = ["GYNIProof.+"]

[[lean_lib]]
name = "GYNIUpper"
globs = ["GYNIUpper.+"]
